name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes an older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.changes.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI gating
        run: make test-ci

      - name: Detect build inputs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make ci-changes

  # Zig 0.15 cannot link against the macOS 26 SDK, so the Ghostty build compiles against the macOS
  # 15.4 SDK. The macos-26 image has only 26.x SDKs. The macos-15 image ships it inside Xcode 16.3.
  zig-sdk:
    needs: changes
    if: needs.changes.outputs.build_required == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Package the macOS 15.4 SDK
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
        run: |
          sdk="$(xcrun --sdk macosx15.4 --show-sdk-path)"
          echo "Packaging $sdk"
          tar -czf "$RUNNER_TEMP/MacOSX15.4.sdk.tar.gz" -C "$sdk" .

      # A tarball keeps the SDK's symlinks, which the artifact upload alone would not.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macosx15.4-sdk
          path: ${{ runner.temp }}/MacOSX15.4.sdk.tar.gz
          retention-days: 1
          compression-level: 0

  build:
    needs: [changes, zig-sdk]
    if: needs.changes.outputs.build_required == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ghostty.pin names the exact Xcode build. Selecting it by path keeps an image update that
      # changes the default Xcode from silently moving the toolchain.
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version

      # The terminal tests drive a real zsh. Outside a terminal, libghostty starts the account's
      # login shell, and the runner account's is the system bash 3.2, which Ghostty's shell
      # integration does not support.
      - name: Make zsh the login shell
        run: |
          sudo dscl . -create "/Users/$USER" UserShell /bin/zsh
          dscl . -read "/Users/$USER" UserShell

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macosx15.4-sdk
          path: ${{ runner.temp }}

      - name: Unpack the macOS 15.4 SDK
        run: |
          sdk="$RUNNER_TEMP/MacOSX15.4.sdk"
          mkdir -p "$sdk"
          tar -xzf "$RUNNER_TEMP/MacOSX15.4.sdk.tar.gz" -C "$sdk"
          echo "GHOSTTY_ZIG_SDK_PATH=$sdk" >>"$GITHUB_ENV"

      # The source tarball, the pinned Zig, Zig's package cache, and the built artifact. The offline
      # check rebuilds from the first three, so all four are kept together.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ghostty
          key: ghostty-${{ runner.arch }}-${{ hashFiles('ghostty.pin') }}

      - name: make ci
        run: make ci

      - name: Keep the UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: .build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # Keep the required check present even when macOS jobs are intentionally skipped or fail.
  ci:
    needs: [changes, zig-sdk, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the expected job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build_required }}
          SDK_RESULT: ${{ needs.zig-sdk.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: make ci-result
