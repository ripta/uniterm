name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes an older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.changes.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI gating
        run: make test-ci

      - name: Detect build inputs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make ci-changes

  # The three macOS jobs run side by side. The UI tests take the longest, so the app job sets the
  # run's length.
  package:
    needs: changes
    if: needs.changes.outputs.build_required == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/macos-setup

      - name: make ci-package
        run: make ci-package

  app:
    needs: changes
    if: needs.changes.outputs.build_required == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/macos-setup

      - name: make ci-app
        run: make ci-app

      - name: Keep the UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: .build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # The offline rebuild proves the pinned Ghostty rebuilds with the network off. Its result depends
  # only on the files and the runner image that the proof key names. Once a run proves a key, later
  # runs with the same key end early. A pull request reads the keys that main saved.
  ghostty-offline:
    needs: changes
    if: needs.changes.outputs.build_required == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name what the rebuild depends on
        id: proof
        run: scripts/ghostty-proof-key.sh

      - name: Look for an earlier proof
        id: earlier
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ghostty-offline-proof
          key: ${{ steps.proof.outputs.key }}
          lookup-only: true

      - name: Report the earlier proof
        if: steps.earlier.outputs.cache-hit == 'true'
        run: echo "An earlier run proved ${{ steps.proof.outputs.key }}, so the rebuild is skipped."

      - if: steps.earlier.outputs.cache-hit != 'true'
        uses: ./.github/actions/macos-setup

      - name: make ghostty-offline-check
        if: steps.earlier.outputs.cache-hit != 'true'
        run: make ghostty-offline-check

      - name: Record the proof
        if: steps.earlier.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/ghostty-offline-proof
          echo "${{ steps.proof.outputs.key }}" >.cache/ghostty-offline-proof/key

      - if: steps.earlier.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ghostty-offline-proof
          key: ${{ steps.proof.outputs.key }}

  # Keep the required check present even when macOS jobs are intentionally skipped or fail.
  ci:
    needs: [changes, package, app, ghostty-offline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the expected job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build_required }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          APP_RESULT: ${{ needs.app.result }}
          GHOSTTY_OFFLINE_RESULT: ${{ needs.ghostty-offline.result }}
        run: make ci-result
